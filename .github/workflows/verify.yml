name: Verify API

on:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          find public src tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check sodium
        shell: bash
        run: php -r 'exit(extension_loaded("sodium") ? 0 : 1);'
