name: Verify API

on: [push, pull_request]

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l public/index.php
      - run: php -l src/common.php
      - run: php -l src/auth.php
      - run: php -l src/handlers.php
      - run: php -r 'exit(extension_loaded("sodium") ? 0 : 1);'
